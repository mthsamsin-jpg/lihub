<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Acesso ADM · Uso LicitaHub</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #040b16; color: #e2e8f0; font: 15px/1.45 Inter, system-ui, sans-serif; }
    main { width: 100%; max-width: 360px; padding: 26px 24px; border: 1px solid #1e293b; border-radius: 16px; background: #0b1220; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 0 0 18px; font-size: 13px; color: #94a3b8; }
    label { display: grid; gap: 6px; margin-bottom: 14px; font-size: 13px; color: #cbd5e1; }
    input { padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; background: #020617; color: #f8fafc; font: inherit; }
    input:focus { outline: 2px solid #f59e0b; border-color: transparent; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #f59e0b; color: #111827; font: 700 15px Inter, system-ui, sans-serif; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .erro { min-height: 1.3em; margin: 12px 0 0; color: #fca5a5; font-size: 13px; }
    a { color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Acesso ADM</h1>
    <p>Área restrita da administração do site.</p>
    <form id="form" autocomplete="on" novalidate>
      <label>Identificador
        <input name="email" type="email" required autocomplete="username" placeholder="adm@licithub.local" autofocus>
      </label>
      <label>Senha
        <input name="senha" type="password" required autocomplete="current-password">
      </label>
      <button type="submit">Entrar</button>
      <p class="erro" id="erro" role="alert"></p>
    </form>
    <a href="/">Voltar ao site</a>
  </main>
  <script>
    const form = document.getElementById('form');
    const erro = document.getElementById('erro');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.textContent = '';
      if (!form.email.value.trim() || !form.senha.value) { erro.textContent = 'Preencha o identificador e a senha.'; return; }
      const b = form.querySelector('button');
      b.disabled = true;
      b.textContent = 'Entrando...';
      try {
        const r = await fetch('/api/adm/login', {
          method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value, senha: form.senha.value }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(r.status === 404 ? 'O modo ADM não está configurado no servidor.' : (j.erro || 'Não foi possível entrar.'));
        location.href = '/adm-painel.html';
      } catch (err) {
        erro.textContent = err.message;
        form.senha.value = '';
        form.senha.focus();
      } finally {
        b.disabled = false;
        b.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
