<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Uso LicitaHub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topo">
    <strong>Uso LicitaHub</strong>
    <span id="quem" class="fraco"></span>
  </header>

  <section id="tela-login" hidden>
    <p class="fraco">Entre com a mesma conta do LicitaHub.</p>
    <form id="form-login">
      <label>E-mail <input name="email" type="email" required autocomplete="username"></label>
      <label>Senha <input name="senha" type="password" required autocomplete="current-password"></label>
      <button type="submit" class="primario">Entrar</button>
    </form>
    <details class="avancado"><summary>Endereço do LicitaHub</summary>
      <form id="form-site"><input name="site" type="url" required><button type="submit">Salvar</button></form>
    </details>
  </section>

  <section id="tela-proposta" hidden>
    <label>Proposta
      <select id="proposta"></select>
    </label>
    <div id="resumo" class="fraco"></div>
    <label class="linha"><input type="checkbox" id="sobrescrever"> Sobrescrever campos que já têm valor</label>
    <div class="botoes">
      <button id="analisar" class="primario">1. Conferir nesta página</button>
      <button id="preencher" disabled>2. Preencher</button>
    </div>
    <div class="botoes secundarios">
      <button id="mapear" title="Lista no console (F12) os campos que a extensão enxerga">Mapear campos</button>
      <button id="limpar">Limpar marcas</button>
      <button id="recarregar">Atualizar propostas</button>
      <button id="sair">Sair</button>
    </div>
    <div id="aviso-portal" class="alerta" hidden></div>
    <div id="relatorio"></div>
  </section>

  <p id="mensagem" class="mensagem" role="status"></p>
  <script src="popup.js" type="module"></script>
</body>
</html>
